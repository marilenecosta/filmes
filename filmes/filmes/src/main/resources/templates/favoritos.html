<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>CineFlow | Meus Favoritos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --azul-escuro: #001f3f;
            --laranja: #ff851b;
            --cinza-fundo: #f4f7f6;
        }

        body {
            background-color: var(--cinza-fundo);
            font-family: 'Segoe UI', sans-serif;
        }

        .header-sistema {
            background-color: var(--azul-escuro);
            color: white;
            padding: 20px 0;
            border-bottom: 6px solid var(--laranja);
        }

        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }

        .table thead {
            background-color: var(--azul-escuro);
            color: white;
        }
    </style>
</head>

<body>
    <div class="header-sistema mb-5">
        <div class="container d-flex justify-content-between align-items-center">
            <h2 class="m-0">⭐ MEUS FILMES FAVORITOS</h2>
            <a th:href="@{/gerenciar}" class="btn btn-outline-light btn-sm">Voltar ao Catálogo</a>
        </div>
    </div>

    <div class="container">
        <div th:if="${mensagemSucesso}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${mensagemSucesso}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="card shadow-sm p-3">
            <table class="table table-hover align-middle">
                <thead>
                    <tr>
                        <th>Título</th>
                        <th>Ano</th>
                        <th>Diretor</th>
                        <th class="text-center">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="f : ${favoritos}">
                        <td class="fw-bold" th:text="${f['titulo'] != null ? f['titulo'] : 'Sem título'}"></td>
                        <td th:text="${f['ano'] != null ? f['ano'] : '-'}"></td>
                        <td th:text="${f['diretor'] != null ? f['diretor'] : '-'}"></td>
                        <td class="text-center">
                            <form th:action="@{'/filme/' + ${f['filme_id']} + '/remover-favorito'}" method="post">
                                <button type="submit" class="btn btn-danger btn-sm">Remover</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(favoritos)}">
                        <td colspan="4" class="text-center text-muted py-4">Você ainda não tem filmes favoritos.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
