<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>CineFlow | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f7f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-login {
            border: none;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            border-top: 6px solid #ff851b;
        }
        .btn-principal {
            background-color: #ff851b;
            color: white;
            border: none;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn-principal:hover {
            background-color: #e67300;
        }
        .titulo-login {
            color: #001f3f;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="card card-login p-4 bg-white">
        <div class="text-center mb-4">
            <h2 class="titulo-login m-0">🎬 CineFlow</h2>
            <small class="text-muted">Acesse o seu catálogo de filmes</small>
        </div>

        <div th:if="${errorMsg}" class="alert alert-danger text-center small" role="alert" th:text="${errorMsg}"></div>
        <div th:if="${logoutMsg}" class="alert alert-success text-center small" role="alert" th:text="${logoutMsg}"></div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label fw-bold">E-mail</label>
                <input type="email" id="username" name="username" class="form-control" placeholder="seu@email.com" required autofocus>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label fw-bold">Senha</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Sua senha" required>
            </div>
            <button type="submit" class="btn btn-principal w-100 py-2">ENTRAR NO SISTEMA</button>
        </form>
    </div>

</body>
</html>
