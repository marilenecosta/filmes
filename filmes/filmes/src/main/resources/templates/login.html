<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>CineFlow | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>
<body>

    <div class="login-container">
        
        <div class="card card-login p-4">
            <div class="text-center mb-4">
                <h2 style="color: #001f3f; font-weight: bold;">🎬 CineFlow</h2>
                <small class="text-muted">Acesse o seu catálogo de filmes</small>
            </div>

            <div th:if="${errorMsg}" class="alert alert-danger text-center small" role="alert" th:text="${errorMsg}"></div>
            <div th:if="${logoutMsg}" class="alert alert-success text-center small" role="alert" th:text="${logoutMsg}"></div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label fw-bold">E-mail</label>
                    <input type="email" id="username" name="username" class="form-control" placeholder="seu@email.com" required autofocus>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label fw-bold">Senha</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Sua senha" required>
                </div>
                
                <button type="submit" class="btn btn-primary w-100 py-2">ENTRAR NO SISTEMA</button>
            </form>
            
        </div>
    </div>

</body>
</html>
