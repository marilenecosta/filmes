<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>CineFlow | Filmes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --azul-escuro: #001f3f; --laranja: #ff851b; --cinza-fundo: #f4f7f6; }
        body { background-color: var(--cinza-fundo); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .header-sistema { background-color: var(--azul-escuro); color: white; padding: 20px 0; border-bottom: 6px solid var(--laranja); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .btn-principal { background-color: var(--laranja); color: white; border: none; font-weight: bold; transition: 0.3s; }
        .btn-principal:hover { background-color: #e67300; transform: translateY(-2px); color: white; }
        .card { border: none; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

    <div class="header-sistema mb-5">
        <div class="container d-flex justify-content-between align-items-center">
            <h2>
                <span th:if="${param.acao != null and param.acao[0] == 'cadastrar'}">➕ CADASTRAR NOVO FILME</span>
                <span th:if="${param.acao != null and param.acao[0] == 'pesquisar'}">🔍 PESQUISAR NO ACERVO</span>
                <span th:if="${filme != null}">📝 EDITAR DADOS DO FILME</span>
                <span th:if="${param.acao == null and filme == null}">🎬 CATÁLOGO DE FILMES</span>
            </h2>
            <div class="d-flex gap-2">
                <a th:href="@{/}" class="btn btn-outline-light btn-sm">Menu</a>
                <a th:if="${session.usuarioLogado}" href="/favoritos" class="btn btn-warning btn-sm">⭐ Favoritos</a>
                <a th:if="${session.usuarioLogado == null}" href="/login" class="btn btn-outline-light btn-sm">Entrar</a>
            </div>
        </div>
    </div>

    <div class="container">
        <div th:if="${mensagem}" class="alert alert-info" th:text="${mensagem}"></div>
        <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>
        <div th:if="${sucesso}" class="alert alert-success" th:text="${sucesso}"></div>

        <div class="card p-4 mb-4" th:if="${param.acao != null and param.acao[0] == 'pesquisar'}">
            <form action="/gerenciar" method="get" class="row g-2 mb-4">
                <input type="hidden" name="acao" value="pesquisar">
                <div class="col-md-10"><input type="text" name="titulo" id="inputPesquisa" class="form-control" placeholder="Título do filme..." required></div>
                <div class="col-md-2"><button type="submit" class="btn btn-principal w-100">Pesquisar</button></div>
            </form>
            
            <table class="table table-hover align-middle" th:if="${!#lists.isEmpty(filmes)}">
                <thead class="table-dark">
                    <tr><th>Título</th><th>Ano</th><th>Diretor</th><th>Gênero</th><th class="text-center">Ações</th></tr>
                </thead>
                <tbody>
                    <tr th:each="f : ${filmes}">
                        <td th:text="${f['titulo'] != null ? f['titulo'] : f.titulo}"></td>
                        <td th:text="${f['ano'] != null ? f['ano'] : f.ano}"></td>
                        <td th:text="${f['diretor'] != null ? f['diretor'] : f.diretor}"></td>
                        <td><span class="badge bg-primary" th:text="${f['genero_nome'] != null ? f['genero_nome'] : (f['nome'] != null ? f['nome'] : f.nomeGenero)}"></span></td>
                        <td class="text-center">
                            <button type="button" class="btn btn-outline-warning btn-sm" th:data-logado="${session.usuarioLogado != null}" th:data-url="@{'/filme/' + ${f['id'] != null ? f['id'] : f.id} + '/favoritar'}" onclick="tentarFavoritar(this)">⭐</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="row row-cols-1 row-cols-md-4 g-4" th:if="${param.acao == null and filme == null}">
            <div class="col" th:each="f : ${filmes}">
                <div class="card h-100 text-center p-3">
                    <div class="mb-2" style="font-size: 2rem;">🎬</div>
                    <h6 class="fw-bold" th:text="${f['titulo'] != null ? f['titulo'] : f.titulo}"></h6>
                    <p class="text-muted small" th:text="${(f['ano'] != null ? f['ano'] : f.ano) + ' • ' + (f['diretor'] != null ? f['diretor'] : f.diretor)}"></p>
                    <button type="button" class="btn btn-outline-warning btn-sm" th:data-logado="${session.usuarioLogado != null}" th:data-url="@{'/filme/' + ${f['id'] != null ? f['id'] : f.id} + '/favoritar'}" onclick="tentarFavoritar(this)">Favoritar ⭐</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function tentarFavoritar(botao) {
            const logado = botao.getAttribute('data-logado') === 'true';
            if (!logado) {
                alert("Ops! Para favoritar, você precisa estar logado.");
                window.location.href = "/login";
            } else {
                const url = botao.getAttribute('data-url');
                const form = document.createElement('form');
                form.method = 'POST';
                form.action = url;
                document.body.appendChild(form);
                form.submit();
            }
        }
    </script>
</body>
</html>
