server:
  port: 8080

spring:
  datasource:
    # O Render vai substituir estas variáveis pelos valores reais que você colocará no "Environment"
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  sql:
    init:
      # Alterado para 'never' para evitar erros de tentativa de criação de tabelas no deploy
      mode: never